[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govdoc-watcher"
version = "0.1.0"
description = "Dynamic watcher/downloader for public government guideline PDFs."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "httpx==0.27.2",
    "PyYAML==6.0.2",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
